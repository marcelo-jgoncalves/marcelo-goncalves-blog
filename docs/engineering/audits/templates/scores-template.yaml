# Template de snapshot de notas — auditoria de consistência do projeto.
# Fonte canônica das regras: docs/engineering/audits/project-consistency-audit.md
# Nunca editar um snapshot já gerado; cada execução cria um arquivo novo.
# Não armazenar trechos grandes de código aqui — só notas, referências e observações curtas.

schema_version: 1
audit_id: PCA-YYYYMMDD-<MODO>
date: YYYY-MM-DD
mode: quick # quick | full | delta | area
area: null # preencher só quando mode == area

repository:
  branch: null
  commit: null
  working_tree_clean: null # true | false

methodology:
  version: 1
  weights_version: 1

overall:
  score: null # null quando o modo não produz nota global (quick/area)
  confidence: null # high | medium-high | medium | low | unknown
  verdict: null # resumo curto

