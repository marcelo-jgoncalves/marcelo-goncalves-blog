<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Widget Certificações</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;
      background:#f5f7fb;
      display:flex;
      justify-content:center;
      padding:40px 20px;
      font-family:'Inter', sans-serif;
      color:#0f172a;
    }

    /*
      SIMULAÇÃO DA SIDEBAR
    */

    .sidebar{
      width:100%;
      max-width:390px;
    }

    /*
      WIDGET
    */

    .widget{

      position:relative;

      padding:28px;

      border-radius:32px;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.96),
          rgba(255,255,255,0.90)
        );

      border:1px solid rgba(226,232,240,0.8);

      box-shadow:
        0 10px 40px rgba(15,23,42,0.06),
        inset 0 1px 0 rgba(255,255,255,0.9);

      backdrop-filter:blur(14px);

      overflow:hidden;
    }

    .widget::before{
      content:"";

      position:absolute;
      inset:0;

      background:
        radial-gradient(
          circle at top right,
          rgba(59,130,246,0.08),
          transparent 30%
        );

      pointer-events:none;
    }

    /*
      HEADER
    */

    .header{
      position:relative;
      z-index:2;

      display:flex;
      flex-direction:column;
      align-items:center;

      margin-bottom:28px;
    }

    .icon-wrapper{

      width:62px;
      height:62px;

      border-radius:20px;

      display:flex;
      align-items:center;
      justify-content:center;

      margin-bottom:18px;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.95),
          rgba(241,245,249,0.9)
        );

      border:1px solid rgba(226,232,240,0.9);

      box-shadow:
        0 8px 24px rgba(15,23,42,0.05),
        inset 0 1px 0 rgba(255,255,255,0.9);
    }

    .icon{
      width:24px;
      height:24px;
      color:#315b92;
    }

    .subtitle{
      font-size:11px;
      font-weight:700;
      letter-spacing:.22em;
      text-transform:uppercase;
      color:#64748b;

      margin-bottom:8px;
    }

    .title{
      font-size:30px;
      font-weight:800;
      letter-spacing:-0.05em;
      color:#0f172a;
    }

    /*
      LISTA
    */

    .list{
      position:relative;
      z-index:2;

      display:flex;
      flex-direction:column;
      gap:18px;
    }

    /*
      CARD
    */

    .card{

      position:relative;

      padding:22px;

      border-radius:26px;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.96),
          rgba(248,250,252,0.94)
        );

      border:1px solid rgba(226,232,240,0.85);

      transition:
        transform .35s ease,
        box-shadow .35s ease,
        border-color .35s ease;
    }

    .card:hover{

      transform:translateY(-4px);

      border-color:rgba(96,165,250,0.35);

      box-shadow:
        0 18px 38px rgba(15,23,42,0.10),
        0 0 26px rgba(59,130,246,0.08);
    }

    /*
      BADGE
    */

    .badge-wrapper{

      display:flex;
      justify-content:center;

      margin-bottom:18px;
    }

    .badge{

      width:92px;
      height:92px;
      object-fit:contain;

      filter:
        drop-shadow(0 8px 18px rgba(37,99,235,0.16));
    }

    /*
      TEXTO
    */

    .provider{

      text-align:center;

      font-size:11px;
      font-weight:700;
      letter-spacing:.18em;
      text-transform:uppercase;

      color:#64748b;

      margin-bottom:10px;
    }

    .name{

      text-align:center;

      font-size:26px;
      line-height:1.05;
      letter-spacing:-0.05em;

      font-weight:800;

      color:#0f172a;

      margin-bottom:14px;
    }

    .level-wrapper{
      display:flex;
      justify-content:center;
    }

    .level{

      display:inline-flex;
      align-items:center;
      justify-content:center;

      padding:9px 14px;

      border-radius:999px;

      background:rgba(37,99,235,0.08);

      color:#2563eb;

      font-size:12px;
      font-weight:700;
    }

    /*
      FOOTER
    */

    .footer{

      margin-top:20px;
      padding-top:18px;

      border-top:1px solid rgba(226,232,240,0.8);

      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .verified{

      display:flex;
      align-items:center;
      gap:8px;

      font-size:12px;
      font-weight:600;

      color:#475569;
    }

    .dot{

      width:8px;
      height:8px;

      border-radius:50%;

      background:#22c55e;

      box-shadow:
        0 0 10px rgba(34,197,94,0.6);
    }

    .year{

      font-size:12px;
      font-weight:700;

      color:#94a3b8;
    }

  </style>
</head>

<body>

  <aside class="sidebar">

    <section class="widget">

      <!-- HEADER -->

      <div class="header">

        <div class="icon-wrapper">

          <svg class="icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M12 15l-3.5 2 1-4-3-2.5 4-.5L12 6l1.5 4 4 .5-3 2.5 1 4z"/>
          </svg>

        </div>

        <div class="subtitle">
          Credenciais Técnicas
        </div>

        <h2 class="title">
          Certificações
        </h2>

      </div>

      <!-- LISTA -->

      <div class="list">

        <!-- CARD -->

        <article class="card">

          <div class="badge-wrapper">

            <img
              class="badge"
              src="https://d1.awsstatic.com/training-and-certification/certification-badges/AWS-Certified-Solutions-Architect-Associate_badge.1b4f5c0f3fcbfca0b56fdf75f1a4bb7a9d8b2c6f.png"
              alt="Solutions Architect Associate"
            >

          </div>

          <div class="provider">
            AWS Certified
          </div>

          <h3 class="name">
            Solutions Architect
          </h3>

          <div class="level-wrapper">

            <div class="level">
              Associate
            </div>

          </div>

          <div class="footer">

            <div class="verified">
              <span class="dot"></span>
              Verified
            </div>

            <div class="year">
              2025
            </div>

          </div>

        </article>

        <!-- CARD -->

        <article class="card">

          <div class="badge-wrapper">

            <img
              class="badge"
              src="https://d1.awsstatic.com/training-and-certification/certification-badges/AWS-Certified-SysOps-Administrator-Associate_badge.c3586b02787dcb5c7d07212e08a3b04fcdeec95d.png"
              alt="SysOps Administrator Associate"
            >

          </div>

          <div class="provider">
            AWS Certified
          </div>

          <h3 class="name">
            SysOps Administrator
          </h3>

          <div class="level-wrapper">

            <div class="level">
              Associate
            </div>

          </div>

          <div class="footer">

            <div class="verified">
              <span class="dot"></span>
              Verified
            </div>

            <div class="year">
              2025
            </div>

          </div>

        </article>

        <!-- CARD -->

        <article class="card">

          <div class="badge-wrapper">

            <img
              class="badge"
              src="https://images.credly.com/size/340x340/images/ed4be915-68f8-428a-b332-40ded9084ee5/blob"
              alt="Terraform Associate"
            >

          </div>

          <div class="provider">
            HashiCorp
          </div>

          <h3 class="name">
            Terraform Associate
          </h3>

          <div class="level-wrapper">

            <div class="level">
              Certified Associate
            </div>

          </div>

          <div class="footer">

            <div class="verified">
              <span class="dot"></span>
              Verified
            </div>

            <div class="year">
              2025
            </div>

          </div>

        </article>

      </div>

    </section>

  </aside>

</body>
</html>
