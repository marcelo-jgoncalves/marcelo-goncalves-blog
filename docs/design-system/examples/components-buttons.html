<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #fff; padding: 28px; display: flex; flex-direction: column; gap: 20px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .label { font-size: 10px; font-weight: 600; color: #94a3b8; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 26px; border-radius: 6px; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.95rem; cursor: pointer; border: none; text-decoration: none; transition: all 0.2s; }
  .btn-primary { background: #3B5F8A; color: white; }
  .btn-primary:hover { background: #2D4F76; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(59,95,138,0.18); }
  .btn-outline { background: transparent; border: 2px solid #3B5F8A; color: #3B5F8A; }
  .btn-outline:hover { background: #3B5F8A; color: white; transform: translateY(-2px); }
  .btn-outline-dark { background: transparent; border: 2px solid #111827; color: #111827; }
  .btn-outline-dark:hover { background: #111827; color: white; transform: translateY(-2px); }
  .btn-ghost { background: transparent; color: #3B5F8A; font-weight: 600; }
  .btn-ghost:hover { background: #EBF1F8; }
  .btn-sm { padding: 7px 16px; font-size: 0.8rem; }
  .btn-lg { padding: 14px 32px; font-size: 1.05rem; }
  .btn-dark-bg { background: #1F2937; padding: 16px 28px; border-radius: 8px; }
</style>
</head>
<body>
<div>
  <div class="label">Primary</div>
  <div class="row">
    <button class="btn btn-primary btn-sm">Pequeno</button>
    <button class="btn btn-primary">Ver Todos os Artigos</button>
    <button class="btn btn-primary btn-lg">Conheça "O Projeto" →</button>
  </div>
</div>
<div>
  <div class="label">Outline & Ghost</div>
  <div class="row">
    <button class="btn btn-outline">Inscrever-se agora</button>
    <button class="btn btn-outline-dark">Fale Comigo</button>
    <button class="btn btn-ghost">Ler mais →</button>
  </div>
</div>
<div class="btn-dark-bg">
  <div class="label" style="color:#475569;margin-bottom:10px">On Dark Background</div>
  <div class="row">
    <button class="btn btn-primary">Inscrever-se agora</button>
    <button class="btn" style="background:transparent;border:2px solid white;color:white;font-family:'DM Sans', sans-serif;font-weight:600">Saiba mais</button>
  </div>
</div>
</body>
</html>
