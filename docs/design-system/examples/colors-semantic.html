<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #fff; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
  .label { font-size: 10px; font-weight: 600; color: #94a3b8; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; background: #f8fafc; border: 1px solid #e2e8f0; min-width: 160px; }
  .chip-dot { width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0; }
  .chip-label { font-size: 11px; }
  .chip-name { font-family: 'DM Sans', sans-serif; font-weight: 600; color: #111827; display: block; }
  .chip-desc { color: #64748b; font-size: 10px; }
  .callouts { display: flex; gap: 8px; flex-wrap: wrap; }
  .callout { padding: 8px 12px; border-radius: 6px; font-size: 11px; font-weight: 500; flex: 1; min-width: 110px; }
</style>
</head>
<body>
<div>
  <div class="label">Text Roles</div>
  <div class="row">
    <div class="chip"><div class="chip-dot" style="background:#111827;"></div><div class="chip-label"><span class="chip-name">Primary</span><span class="chip-desc">headings, logo</span></div></div>
    <div class="chip"><div class="chip-dot" style="background:#374151;"></div><div class="chip-label"><span class="chip-name">Body</span><span class="chip-desc">prose, UI</span></div></div>
    <div class="chip"><div class="chip-dot" style="background:#6B7280;"></div><div class="chip-label"><span class="chip-name">Muted</span><span class="chip-desc">metadata, captions</span></div></div>
    <div class="chip"><div class="chip-dot" style="background:#3B5F8A;"></div><div class="chip-label"><span class="chip-name">Accent / Link</span><span class="chip-desc">CTAs, links</span></div></div>
    <div class="chip"><div class="chip-dot" style="background:#fff; border:1px solid #e2e8f0;"></div><div class="chip-label"><span class="chip-name">Invert</span><span class="chip-desc">on dark bg</span></div></div>
  </div>
</div>
<div>
  <div class="label">Callouts</div>
  <div class="callouts">
    <div class="callout" style="background:#EEF4FB; border-left:3px solid #9DBFE0; color:#1E3A5F;">ℹ Info</div>
    <div class="callout" style="background:#EEF4FB; border-left:3px solid #9DBFE0; color:#1E3A5F;">💡 Tip</div>
    <div class="callout" style="background:#FFFBEB; border-left:3px solid #FDE68A; color:#78350F;">⚠ Warn</div>
    <div class="callout" style="background:#FEF2F2; border-left:3px solid #FECACA; color:#7F1D1D;">✕ Danger</div>
  </div>
</div>
</body>
</html>
