<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #fff; padding: 24px 28px; }
  .row { display: flex; flex-direction: column; gap: 6px; }
  .specimen { display: flex; align-items: baseline; gap: 16px; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
  .specimen:last-child { border-bottom: none; }
  .meta { width: 80px; flex-shrink: 0; }
  .meta-size { font-size: 10px; font-weight: 600; color: #3B5F8A; font-family: monospace; }
  .meta-weight { font-size: 10px; color: #94a3b8; }
  .text { font-family: 'DM Sans', sans-serif; color: #111827; }
</style>
</head>
<body>
<div class="row">
  <div class="specimen">
    <div class="meta"><div class="meta-size">3rem</div><div class="meta-weight">700</div></div>
    <div class="text" style="font-size:3rem;font-weight:700;line-height:1.1;letter-spacing:-0.03em">IA Decifrada</div>
  </div>
  <div class="specimen">
    <div class="meta"><div class="meta-size">2.25rem</div><div class="meta-weight">700</div></div>
    <div class="text" style="font-size:2.25rem;font-weight:700;line-height:1.2;letter-spacing:-0.02em">Inteligência Artificial</div>
  </div>
  <div class="specimen">
    <div class="meta"><div class="meta-size">1.875rem</div><div class="meta-weight">700</div></div>
    <div class="text" style="font-size:1.875rem;font-weight:700;line-height:1.3">Cloud Computing & DevOps</div>
  </div>
  <div class="specimen">
    <div class="meta"><div class="meta-size">1.5rem</div><div class="meta-weight">600</div></div>
    <div class="text" style="font-size:1.5rem;font-weight:600;line-height:1.3">Como construir um RAG Serverless</div>
  </div>
  <div class="specimen">
    <div class="meta"><div class="meta-size">1.25rem</div><div class="meta-weight">600</div></div>
    <div class="text" style="font-size:1.25rem;font-weight:600">Análises profundas e tutoriais práticos</div>
  </div>
  <div class="specimen">
    <div class="meta"><div class="meta-size">1rem</div><div class="meta-weight">500</div></div>
    <div class="text" style="font-size:1rem;font-weight:500">Ver Todos os Artigos</div>
  </div>
</div>
</body>
</html>
