<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #f8fafc; padding: 32px; display: flex; flex-direction: column; align-items: flex-start; gap: 24px; }
  .row { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .label { font-size: 10px; font-weight: 600; color: #94a3b8; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
</style>
</head>
<body>
  <div>
    <div class="label">Full Logotype</div>
    <img src="../assets/logo-mark.svg" alt="MarceloGonçalves" style="height:48px">
  </div>
  <div>
    <div class="label">Icon Mark</div>
    <div class="row">
      <img src="../assets/logo-icon.svg" alt="IA" style="height:44px">
      <img src="../assets/logo-icon.svg" alt="IA" style="height:32px">
      <img src="../assets/logo-icon.svg" alt="IA" style="height:24px">
    </div>
  </div>
  <div>
    <div class="label">On Dark</div>
    <div style="background:#111827;padding:20px 28px;border-radius:12px;display:flex;align-items:center;gap:16px">
      <img src="../assets/logo-mark.svg" alt="MarceloGonçalves" style="height:40px;filter:brightness(0) invert(1) saturate(0);opacity:0.95">
    </div>
  </div>
</body>
</html>
