<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #fff; padding: 24px; display: flex; flex-direction: column; gap: 20px; max-width: 480px; }
  .label { font-size: 10px; font-weight: 600; color: #94a3b8; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 0.85rem; font-weight: 500; color: #374151; }
  .field input, .field textarea { border: 1px solid #E2E8F0; border-radius: 6px; padding: 10px 14px; font-family: 'Inter', sans-serif; font-size: 0.95rem; color: #111827; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
  .field input:focus, .field textarea:focus { border-color: #3B5F8A; box-shadow: 0 0 0 3px rgba(59,95,138,0.12); }
  .field input.error { border-color: #EF4444; }
  .field .hint { font-size: 0.78rem; color: #94A3B8; }
  .field .err-msg { font-size: 0.78rem; color: #EF4444; }
  .search-bar { display: flex; border-radius: 8px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.08); border: 1px solid #E2E8F0; }
  .search-bar input { flex: 1; border: none; padding: 14px 18px; font-size: 1rem; outline: none; color: #111827; }
  .search-bar button { background: #3B5F8A; color: white; border: none; padding: 0 22px; font-size: 1.1rem; cursor: pointer; transition: background 0.2s; }
  .search-bar button:hover { background: #2D4F76; }
</style>
</head>
<body>
  <div>
    <div class="label">Text Input</div>
    <div class="field">
      <label>Nome</label>
      <input type="text" placeholder="Seu nome completo" value="Marcelo Gonçalves">
      <span class="hint">Usado na newsletter.</span>
    </div>
  </div>
  <div>
    <div class="label">Input — Error State</div>
    <div class="field">
      <label>E-mail</label>
      <input type="email" class="error" placeholder="seu@email.com" value="email-invalido">
      <span class="err-msg">Por favor, insira um e-mail válido.</span>
    </div>
  </div>
  <div>
    <div class="label">Search Bar</div>
    <div class="search-bar">
      <input type="text" placeholder="Buscar artigos sobre IA, AWS, DevOps…">
      <button>&#x2192;</button>
    </div>
  </div>
</body>
</html>
