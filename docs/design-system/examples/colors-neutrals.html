<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,600&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #fff; padding: 24px; }
  .row { display: flex; gap: 8px; }
  .swatch { flex: 1; border-radius: 8px; overflow: hidden; }
  .swatch-color { height: 56px; }
  .swatch-label { padding: 6px 8px; background: #f8fafc; }
  .swatch-name { font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 10px; color: #111827; }
  .swatch-hex { font-size: 9px; color: #64748b; font-family: monospace; }
</style>
</head>
<body>
<div class="row">
  <div class="swatch">
    <div class="swatch-color" style="background:#F8FAFC; border:1px solid #e2e8f0;"></div>
    <div class="swatch-label"><div class="swatch-name">50</div><div class="swatch-hex">#F8FAFC</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#F1F5F9;"></div>
    <div class="swatch-label"><div class="swatch-name">100</div><div class="swatch-hex">#F1F5F9</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#E2E8F0;"></div>
    <div class="swatch-label"><div class="swatch-name">200</div><div class="swatch-hex">#E2E8F0</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#CBD5E1;"></div>
    <div class="swatch-label"><div class="swatch-name">300</div><div class="swatch-hex">#CBD5E1</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#94A3B8;"></div>
    <div class="swatch-label"><div class="swatch-name">400</div><div class="swatch-hex">#94A3B8</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#6B7280;"></div>
    <div class="swatch-label"><div class="swatch-name">500</div><div class="swatch-hex">#6B7280</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#475569;"></div>
    <div class="swatch-label"><div class="swatch-name">600</div><div class="swatch-hex">#475569</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#374151;"></div>
    <div class="swatch-label"><div class="swatch-name">700</div><div class="swatch-hex">#374151</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#1F2937;"></div>
    <div class="swatch-label"><div class="swatch-name">800</div><div class="swatch-hex">#1F2937</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#111827;"></div>
    <div class="swatch-label"><div class="swatch-name">900</div><div class="swatch-hex">#111827</div></div>
  </div>
</div>
</body>
</html>
