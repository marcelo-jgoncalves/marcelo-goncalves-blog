<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #fff; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
  .label { font-size: 10px; font-weight: 600; color: #94a3b8; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
  .row { display: flex; align-items: flex-end; gap: 6px; }
  .bar-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .bar { background: #3B5F8A; border-radius: 3px; width: 32px; opacity: 0.15; }
  .bar.active { opacity: 1; }
  .bar-val { font-size: 9px; color: #64748b; font-family: monospace; }
  .token { font-size: 10px; font-weight: 600; color: #111827; font-family: 'DM Sans', sans-serif; }
  .example-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .ex-box { background: #EBF1F8; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .ex-label { font-size: 10px; color: #3B5F8A; font-weight: 600; white-space: nowrap; }
</style>
</head>
<body>
<div>
  <div class="label">Spacing Scale</div>
  <div class="row">
    <div class="bar-group"><div class="bar active" style="height:4px"></div><div class="bar-val">4</div><div class="token">1</div></div>
    <div class="bar-group"><div class="bar active" style="height:8px"></div><div class="bar-val">8</div><div class="token">2</div></div>
    <div class="bar-group"><div class="bar active" style="height:12px"></div><div class="bar-val">12</div><div class="token">3</div></div>
    <div class="bar-group"><div class="bar active" style="height:16px"></div><div class="bar-val">16</div><div class="token">4</div></div>
    <div class="bar-group"><div class="bar active" style="height:20px"></div><div class="bar-val">20</div><div class="token">5</div></div>
    <div class="bar-group"><div class="bar active" style="height:24px"></div><div class="bar-val">24</div><div class="token">6</div></div>
    <div class="bar-group"><div class="bar active" style="height:32px"></div><div class="bar-val">32</div><div class="token">8</div></div>
    <div class="bar-group"><div class="bar active" style="height:40px"></div><div class="bar-val">40</div><div class="token">10</div></div>
    <div class="bar-group"><div class="bar active" style="height:48px"></div><div class="bar-val">48</div><div class="token">12</div></div>
    <div class="bar-group"><div class="bar active" style="height:64px"></div><div class="bar-val">64</div><div class="token">16</div></div>
    <div class="bar-group"><div class="bar active" style="height:80px"></div><div class="bar-val">80</div><div class="token">20</div></div>
  </div>
</div>
<div>
  <div class="label">Border Radius</div>
  <div class="example-row">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:32px;height:32px;background:#3B5F8A;border-radius:4px;opacity:0.7"></div><span style="font-size:9px;color:#64748b">sm 4px</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:32px;height:32px;background:#3B5F8A;border-radius:6px;opacity:0.8"></div><span style="font-size:9px;color:#64748b">md 6px</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:32px;height:32px;background:#3B5F8A;border-radius:10px;opacity:0.85"></div><span style="font-size:9px;color:#64748b">lg 10px</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:32px;height:32px;background:#3B5F8A;border-radius:12px"></div><span style="font-size:9px;color:#64748b">xl 12px</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:32px;height:32px;background:#3B5F8A;border-radius:9999px"></div><span style="font-size:9px;color:#64748b">full</span></div>
  </div>
</div>
</body>
</html>
