<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #fff; padding: 24px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch { flex: 1; min-width: 90px; border-radius: 8px; overflow: hidden; }
  .swatch-color { height: 72px; }
  .swatch-label { padding: 8px 10px; background: #f8fafc; }
  .swatch-name { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 11px; color: #111827; }
  .swatch-hex { font-size: 10px; color: #6B7280; font-family: monospace; margin-top: 2px; }
  .group-label { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 11px; color: #9CA3AF; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; margin-top: 18px; }
  .group-label:first-child { margin-top: 0; }
</style>
</head>
<body>
<div class="group-label">Brand Accent — Classic Blue</div>
<div class="row">
  <div class="swatch">
    <div class="swatch-color" style="background:#EBF1F8; border:1px solid #D0E4F2;"></div>
    <div class="swatch-label"><div class="swatch-name">Muted</div><div class="swatch-hex">#EBF1F8</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#D0E4F2;"></div>
    <div class="swatch-label"><div class="swatch-name">Soft</div><div class="swatch-hex">#D0E4F2</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#8AAEC8;"></div>
    <div class="swatch-label"><div class="swatch-name">Light</div><div class="swatch-hex">#8AAEC8</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#3B5F8A; outline: 2px solid #3B5F8A; outline-offset: 2px; border-radius: 4px;"></div>
    <div class="swatch-label"><div class="swatch-name">Accent ★</div><div class="swatch-hex">#3B5F8A</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#2D4F76;"></div>
    <div class="swatch-label"><div class="swatch-name">Hover</div><div class="swatch-hex">#2D4F76</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#1E3A57;"></div>
    <div class="swatch-label"><div class="swatch-name">Press</div><div class="swatch-hex">#1E3A57</div></div>
  </div>
</div>
<div class="group-label">Brand Dark — Near-Black</div>
<div class="row">
  <div class="swatch">
    <div class="swatch-color" style="background:#374151;"></div>
    <div class="swatch-label"><div class="swatch-name">Surface 2</div><div class="swatch-hex">#374151</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#1F2937;"></div>
    <div class="swatch-label"><div class="swatch-name">Surface</div><div class="swatch-hex">#1F2937</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#111827; outline: 2px solid #3B5F8A; outline-offset: 2px; border-radius: 4px;"></div>
    <div class="swatch-label"><div class="swatch-name">Dark ★</div><div class="swatch-hex">#111827</div></div>
  </div>
</div>
</body>
</html>
