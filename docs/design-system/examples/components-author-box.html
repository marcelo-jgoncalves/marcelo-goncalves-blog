<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #f8fafc; padding: 24px; }
  .author-box { background: white; padding: 24px; border-radius: 12px; border: 1px solid #E2E8F0; display: flex; align-items: flex-start; gap: 20px; max-width: 620px; }
  .author-avatar { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg,#3B5F8A,#8AAEC8); border: 3px solid white; box-shadow: 0 4px 10px rgba(59,95,138,0.2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.8rem; }
  .author-info { flex: 1; }
  .author-name-dark { font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 1.1rem; color: #111827; display: inline; }
  .author-name-accent { color: #3B5F8A; }
  .author-bio { font-size: 0.92rem; color: #475569; line-height: 1.6; margin-top: 6px; }
  .author-social { display: flex; gap: 14px; margin-top: 12px; }
  .author-social a { color: #374151; font-size: 1.1rem; transition: color 0.2s; text-decoration: none; }
  .author-social a:hover { color: #3B5F8A; }
</style>
</head>
<body>
  <div class="author-box">
    <div class="author-avatar"><i class="fa-solid fa-user"></i></div>
    <div class="author-info">
      <p class="author-bio">
        <span class="author-name-dark">Marcelo<span class="author-name-accent">Gonçalves</span> </span>
        é Engenheiro de Software especializado em AWS, IA e DevOps. Neste blog compartilha tutoriais práticos e análises aprofundadas sobre as tecnologias que estão moldando o futuro.
      </p>
      <div class="author-social">
        <a href="#"><i class="fab fa-linkedin-in"></i></a>
        <a href="#"><i class="fab fa-github"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
      </div>
    </div>
  </div>
</body>
</html>
