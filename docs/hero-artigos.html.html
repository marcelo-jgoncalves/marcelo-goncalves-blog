<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Hero - Página de Artigos</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  background:#f8fafc;
  color:#1e293b;
}

/* =========================
   NAV (PADRÃO DO SITE)
========================= */

.nav{
  background:#f1f3f5;
  border-bottom:1px solid #e5e7eb;
}

.nav-container{
  max-width:1180px;
  margin:auto;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-weight:700;
  font-size:1.4rem;
}

.logo span{
  color:#466589;
}

.nav-menu{
  display:flex;
  gap:32px;
}

.nav-menu a{
  text-decoration:none;
  color:#334155;
  font-weight:500;
}

.nav-menu a.active{
  color:#466589;
}

/* =========================
   HERO ARTIGOS
========================= */

.page-hero{
  background:linear-gradient(
    180deg,
    #f1f3f5 0%,
    #e9edf2 100%
  );

  border-bottom:1px solid #e5e7eb;
  padding:80px 20px;
}

.hero-container{
  max-width:820px;
  margin:auto;
  text-align:center;
}

.hero-eyebrow{
  color:#466589;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  font-size:.8rem;
  margin-bottom:14px;
}

.hero-title{
  font-size:2.6rem;
  font-weight:700;
  line-height:1.2;
  margin-bottom:16px;
}

.hero-description{
  color:#64748b;
  font-size:1.05rem;
  margin-bottom:34px;
}

/* SEARCH */

.hero-search{
  display:flex;
  justify-content:center;
}

.search-box{
  display:flex;
  width:100%;
  max-width:560px;
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:
    0 10px 30px rgba(0,0,0,0.06);
}

.search-box input{
  flex:1;
  padding:16px 18px;
  border:none;
  outline:none;
  font-size:1rem;
}

.search-box button{
  background:#466589;
  color:white;
  border:none;
  padding:0 26px;
  cursor:pointer;
  font-size:1.1rem;
  transition:.25s;
}

.search-box button:hover{
  background:#3c5876;
}

/* TAGS */

.hero-tags{
  margin-top:28px;
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
}

.tag{
  background:white;
  border:1px solid #e5e7eb;
  padding:8px 14px;
  border-radius:999px;
  font-size:.85rem;
  color:#475569;
  cursor:pointer;
  transition:.2s;
}

.tag:hover{
  border-color:#466589;
  color:#466589;
}

</style>
</head>

<body>

<!-- NAV -->

<nav class="nav">
  <div class="nav-container">

    <div class="logo">
      Marcelo<span>Gonçalves</span>
    </div>

    <div class="nav-menu">
      <a href="#">Home</a>
      <a class="active" href="#">Artigos</a>
      <a href="#">O Projeto</a>
      <a href="#">Serviços</a>
      <a href="#">Sobre</a>
    </div>

  </div>
</nav>

<!-- HERO ARTIGOS -->

<section class="page-hero">

  <div class="hero-container">

    <div class="hero-eyebrow">
      Biblioteca de Conteúdo
    </div>

    <h1 class="hero-title">
      Explore nossos artigos
    </h1>

    <p class="hero-description">
      Conteúdo prático sobre AWS, Serverless, DevOps e Arquitetura de Nuvem
      para profissionais que querem construir soluções modernas.
    </p>

    <div class="hero-search">

      <div class="search-box">
        <input placeholder="Buscar por AWS, Terraform, RAG, Serverless..." />
        <button>🔍</button>
      </div>

    </div>

    <div class="hero-tags">
      <div class="tag">AWS</div>
      <div class="tag">Terraform</div>
      <div class="tag">Serverless</div>
      <div class="tag">DevOps</div>
      <div class="tag">Arquitetura</div>
    </div>

  </div>

</section>

</body>
</html>
