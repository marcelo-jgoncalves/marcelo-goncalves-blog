name: Deploy Pipeline (CD)

on:
  push:
    branches:
      - develop
  # No `environment` input: deploy-dev is the only deploy job, gated on
  # `github.ref == 'refs/heads/develop'` — a dispatch input here would have
  # no effect on which one runs.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Two close pushes to develop would trigger concurrent terraform applies —
# the state lock prevents corruption, but the older run fails on the lock and
# apply order becomes a lottery. cancel-in-progress is false on purpose:
# cancelling a terraform apply midway leaves a stuck lock/partial apply; runs
# queue up and apply in commit order.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_NAME: marcelo-goncalves-blog
  AWS_REGION: us-east-1
  NODE_VERSION: '24'
  TERRAFORM_VERSION: '1.15.8'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:

  # ==============================================================
  # JOB 1a: Build Backend (Lambdas) — paralelo com 1b
  # ==============================================================
  build-backend:
    name: 1a. Build Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # Single root install: package.json declares npm workspaces
      # (packages/contracts, backend, frontend, admin) resolved against one
      # hoisted lockfile, so `npm ci` at repo root installs every
      # workspace's deps (including @mgoncalves/contracts' own deps, like
      # zod) in one pass instead of a separate ci per folder.
      - name: Install dependencies (npm workspaces)
        run: npm ci

      - name: Dependency audit (npm audit)
        run: npm audit --audit-level=high
        working-directory: backend

      - name: Typecheck backend
        run: npm run typecheck
        working-directory: backend

      - name: Lint backend
        run: npm run lint
        working-directory: backend

      - name: Test backend Lambdas
        run: npm test
        working-directory: backend

      - name: Build backend Lambdas
        run: npm run build
        working-directory: backend

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts-backend
          path: infra/builds/
          retention-days: 1

  # ==============================================================
  # JOB 1b': Backend Integration Tests — paralelo com 1a/1b
  # Unit tests mock dynamo.send entirely, so they can't catch a contract the
  # mock accepts but the real service rejects (missing IAM permission, an
  # empty string in a GSI range key, a TransactWriteItems rollback) — the
  # class of bug that has actually bitten this project. These run the real
  # handlers against DynamoDB Local (see backend/src/integration/).
  # ==============================================================
  test-backend-integration:
    name: 1b'. Backend Integration Tests
    runs-on: ubuntu-latest

    services:
      dynamodb:
        image: amazon/dynamodb-local@sha256:d7ebddeb60fa418bcda218a6c6a402a58441b2a20d54c9cb1d85fd5194341753 # 2.5.2
        ports:
          - 8000:8000

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies (npm workspaces)
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        working-directory: backend
        env:
          AWS_ENDPOINT_URL: http://localhost:8000

  # ==============================================================
  # JOB 1b: Build Frontend (Next.js + OpenNext) — paralelo com 1a
  # ==============================================================
  build-frontend:
    name: 1b. Build Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies (npm workspaces)
        run: npm ci

      - name: Dependency audit (npm audit)
        run: npm audit --audit-level=high
        working-directory: frontend

      # cd.yml triggers on push to develop (the post-merge state), independent
      # of whether deploy.yml's PR checks ran on the source branch — without
      # these two steps here, cd.yml itself would deploy frontend code that
      # was never tested or linted by this pipeline.
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Test frontend
        run: npm test
        working-directory: frontend

      - name: Build frontend (OpenNext)
        run: npx open-next build
        working-directory: frontend

      - name: Package Next.js Lambda
        run: |
          mkdir -p infra/builds
          cd frontend/.open-next/server-functions/default
          find . -exec touch -t 202001010000.00 {} \;
          zip -rX ../../../../infra/builds/nextjs.zip .

      - name: Copy frontend static assets
        run: cp -r frontend/.open-next/assets infra/builds/nextjs-assets

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts-frontend
          path: |
            infra/builds/nextjs.zip
            infra/builds/nextjs-assets/
          retention-days: 1

  # ==============================================================
  # JOB 1c: Test Admin — paralelo com 1a/1b
  # The admin SPA is only BUILT during deploy (it needs terraform outputs),
  # so without this job its tests/lint never ran on the direct-push flow.
  # ==============================================================
  test-admin:
    name: 1c. Test Admin
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies (npm workspaces)
        run: npm ci

      - name: Dependency audit (npm audit)
        run: npm audit --audit-level=high
        working-directory: admin

      - name: Lint admin
        run: npm run lint
        working-directory: admin

      - name: Test admin
        run: npm test
        working-directory: admin

  # ==============================================================
  # JOB 1c': Test @mgoncalves/contracts — the shared Zod schema package
  # backend/admin both depend on via workspace. Its own test suite and
  # typecheck never ran in CI before (only `npm ci` for the install side
  # effect) — backend/admin tests exercise it indirectly through their own
  # code paths, but never its internal edge cases in isolation.
  # ==============================================================
  test-contracts:
    name: 1c'. Test Contracts Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies (npm workspaces)
        run: npm ci

      - name: Dependency audit (npm audit)
        run: npm audit --audit-level=high
        working-directory: packages/contracts

      - name: Typecheck contracts
        run: npm run typecheck
        working-directory: packages/contracts

      - name: Test contracts
        run: npm test
        working-directory: packages/contracts

  # ==============================================================
  # JOB 1d: Security scans (Semgrep + Gitleaks) — reused from security.yml
  # via workflow_call. Previously this ran only as a parallel, independent
  # workflow with no bearing on whether deploy-dev ran below — a failing
  # scan never blocked a deploy. Listing it in `needs` is what turns it
  # into an actual gate.
  # ==============================================================
  security-scans:
    name: 1d. Security Scans (Semgrep + Gitleaks)
    uses: ./.github/workflows/security.yml
    secrets: inherit

  # ==============================================================
  # JOB 1f: Validate editorial plans (schema + lifecycle invariants,
  # deterministic, no LLM). Runs in --changed-only mode: the 26 plans that
  # predate this validator don't carry schema_version yet (migration is
  # tracked separately, Fase G of
  # docs/engineering/work-items/2026/08/2026-08-14-evolucao-subsistema-editorial.md)
  # — full-repo strict mode would fail this gate for files nobody touched.
  # New/edited plans are enforced immediately; historical ones get
  # validated the moment someone next edits them.
  # ==============================================================
  validate-editorial:
    name: 1f. Validate Editorial Plans
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies (npm workspaces)
        run: npm ci

      - name: Test validator itself
        run: npm run test:editorial

      - name: Validate changed editorial plans
        run: npm run validate:editorial -- --changed-only

  # ==============================================================
  # JOB 1e: Validate infra (Terraform fmt/validate/TFLint + Trivy config
  # scan) — same checks deploy.yml already runs on PRs against develop, but
  # cd.yml triggers on push to develop independent of which PR (if any) ran
  # deploy.yml's checks on the source branch. Without this job here,
  # TFLint/Trivy would never actually gate a deploy despite existing in the
  # repo.
  # ==============================================================
  validate-infra:
    name: 1e. Validate Infra (Terraform + TFLint + Trivy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform fmt check
        working-directory: infra
        run: terraform fmt -check -recursive

      # `terraform validate` evaluates filebase64sha256() over each Lambda
      # zip (source_code_hash), which fails outright if the file doesn't
      # exist — this job runs standalone (no build-backend/build-frontend
      # dependency, to validate on every push regardless of whether the
      # build succeeded), so the real zips never exist here. Content doesn't
      # matter: validate only needs the function call to resolve, not a real
      # deployable artifact.
      - name: Create placeholder build artifacts (validate only, not a real deploy)
        run: |
          mkdir -p infra/builds
          for name in nextjs mediaUpload getPost getAuthor getPosts adminPosts adminAuthors adminCategories adminSession adminAuthorizer postScheduler imageProcessor postCounterReconciler; do
            touch "infra/builds/${name}.zip"
          done

      - name: Terraform init (no backend)
        working-directory: infra
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infra
        run: terraform validate

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('infra/.tflint.hcl') }}

      - name: TFLint
        working-directory: infra
        run: |
          tflint --init
          tflint --recursive --chdir=.

      - name: Trivy config scan (IaC)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # ==============================================================
  # JOB 2a: Deploy to Dev (branch develop)
  # ==============================================================
  deploy-dev:
    name: 2a. Deploy → Dev
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, test-admin, test-contracts, test-backend-integration, security-scans, validate-infra, validate-editorial]
    if: github.ref == 'refs/heads/develop'
    environment: dev

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts-backend
          path: infra/builds/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts-frontend
          path: infra/builds/

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init (dev)
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ env.PROJECT_NAME }}-dev-tfstate" \
            -backend-config="key=blog/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform Apply (dev)
        working-directory: infra
        run: terraform apply -auto-approve -var-file="env/dev.tfvars"

      # Single -json call instead of 9 separate -raw invocations — each -raw
      # spawns a full terraform process (~1.5-2s each, ~15s per deploy).
      - name: Get Terraform outputs
        id: tf
        working-directory: infra
        run: |
          outputs=$(terraform output -json)
          jq -r '"api_url=\(.api_base_url.value)",
                 "frontend_bucket=\(.frontend_bucket.value)",
                 "frontend_cf=\(.frontend_cloudfront_id.value)",
                 "admin_bucket=\(.admin_bucket.value)",
                 "admin_cf=\(.admin_cloudfront_id.value)",
                 "cognito_pool=\(.cognito_user_pool_id.value)",
                 "cognito_client=\(.cognito_client_id.value)",
                 "admin_url=\(.admin_url.value)",
                 "frontend_url=\(.frontend_url.value)"' <<< "$outputs" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies (npm workspaces)
        run: npm ci

      - name: Build admin SPA
        working-directory: admin
        env:
          VITE_API_BASE_URL: ${{ steps.tf.outputs.api_url }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.tf.outputs.cognito_pool }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.tf.outputs.cognito_client }}
          VITE_ASSETS_URL: ${{ steps.tf.outputs.frontend_url }}
        run: npm run build

      - name: Sync frontend static assets to S3
        run: |
          aws s3 sync infra/builds/nextjs-assets s3://${{ steps.tf.outputs.frontend_bucket }} \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "media/*"

      - name: Sync admin SPA to S3
        run: |
          aws s3 sync admin/dist s3://${{ steps.tf.outputs.admin_bucket }} \
            --cache-control "no-cache, no-store, must-revalidate" \
            --delete

      - name: Invalidate CloudFront (frontend + admin)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.tf.outputs.frontend_cf }} \
            --paths "/*"
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.tf.outputs.admin_cf }} \
            --paths "/*"

      - name: Post-deploy smoke test
        run: |
          # frontend_url and admin_url already come with https:// (infra/outputs.tf)
          for url in "${{ steps.tf.outputs.frontend_url }}" "${{ steps.tf.outputs.admin_url }}"; do
            echo "Checking $url ..."
            status=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 10 --retry-all-errors "$url")
            if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
              echo "FAILED: $url returned $status"
              exit 1
            fi
            echo "OK: $url returned $status"
          done

          # API smoke: catches IAM/policy and gateway-wiring gaps that only
          # manifest against the real services (unit tests mock all of AWS).
          for path in "/artigos" "/posts/recentes?limit=1"; do
            api="${{ steps.tf.outputs.api_url }}${path}"
            echo "Checking API $api ..."
            status=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 --retry-all-errors "$api")
            if [ "$status" != "200" ]; then
              echo "FAILED: $api returned $status"
              exit 1
            fi
            echo "OK: $api returned 200"
          done

      # The curl smoke above only proves both URLs answer 2xx/3xx — not that
      # the app renders. The Playwright smoke spec drives a real browser
      # against the freshly deployed environment. Chromium only: cross-browser
      # belongs to the full e2e suite (local), not to this deploy gate.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: E2E post-deploy smoke (Playwright)
        run: npx playwright test e2e/smoke.spec.ts --project=chromium
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.tf.outputs.frontend_url }}

      - name: Deploy summary
        run: |
          echo "### Dev Deploy Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend:** https://${{ steps.tf.outputs.frontend_bucket }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Admin:** ${{ steps.tf.outputs.admin_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API:** ${{ steps.tf.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
