name: Deploy Pipeline (CD)

on:
  push:
    branches:
      - develop
      - main
  # No `environment` input: every job below already branches on `github.ref`
  # (develop -> deploy-dev, main -> plan-prod/deploy-prod) — a dispatch input
  # here would have no effect on which one runs, since the ref you pick when
  # triggering manually already decides that.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Two close pushes to develop would trigger concurrent terraform applies —
# the state lock prevents corruption, but the older run fails on the lock and
# apply order becomes a lottery. cancel-in-progress is false on purpose:
# cancelling a terraform apply midway leaves a stuck lock/partial apply; runs
# queue up and apply in commit order.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_NAME: marcelo-goncalves-blog
  AWS_REGION: us-east-1
  NODE_VERSION: '22'
  TERRAFORM_VERSION: '1.15.8'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:

  # ==============================================================
  # JOB 0: Checagem de deriva de tipos (backend vs admin)
  # Achado da auditoria world-class 2026-07-24: e_popular/e_projeto tinham
  # tipos incompatíveis entre os dois workspaces sem nenhum mecanismo que
  # detectasse isso. Script puro (sem deps) comparando a interface Post —
  # roda antes do build pra falhar rápido, sem gastar minutos de CI.
  # ==============================================================
  check-types-drift:
    name: 0. Checar deriva de tipos (backend/admin)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Checar deriva de tipos
        run: npm run check:types-drift

  # ==============================================================
  # JOB 1a: Build Backend (Lambdas) — paralelo com 1b
  # ==============================================================
  build-backend:
    name: 1a. Build Backend
    runs-on: ubuntu-latest
    needs: [check-types-drift]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: backend/node_modules
          key: backend-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: backend-${{ runner.os }}-

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Dependency audit (npm audit)
        run: npm audit --audit-level=high
        working-directory: backend

      - name: Lint backend
        run: npm run lint
        working-directory: backend

      - name: Test backend Lambdas
        run: npm test
        working-directory: backend

      - name: Build backend Lambdas
        run: npm run build
        working-directory: backend

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts-backend
          path: infra/builds/
          retention-days: 1

  # ==============================================================
  # JOB 1b': Backend Integration Tests — paralelo com 1a/1b
  # Unit tests mock dynamo.send entirely, so they can't catch a contract the
  # mock accepts but the real service rejects (missing IAM permission, an
  # empty string in a GSI range key, a TransactWriteItems rollback) — the
  # class of bug that has actually bitten this project. These run the real
  # handlers against DynamoDB Local (see backend/src/integration/).
  # ==============================================================
  test-backend-integration:
    name: 1b'. Backend Integration Tests
    runs-on: ubuntu-latest
    needs: [check-types-drift]

    services:
      dynamodb:
        image: amazon/dynamodb-local@sha256:d7ebddeb60fa418bcda218a6c6a402a58441b2a20d54c9cb1d85fd5194341753 # 2.5.2
        ports:
          - 8000:8000

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: backend/node_modules
          key: backend-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: backend-${{ runner.os }}-

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run integration tests
        run: npm run test:integration
        working-directory: backend
        env:
          AWS_ENDPOINT_URL: http://localhost:8000

  # ==============================================================
  # JOB 1b: Build Frontend (Next.js + OpenNext) — paralelo com 1a
  # ==============================================================
  build-frontend:
    name: 1b. Build Frontend
    runs-on: ubuntu-latest
    needs: [check-types-drift]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: frontend/node_modules
          key: frontend-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: frontend-${{ runner.os }}-

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Dependency audit (npm audit)
        run: npm audit --audit-level=high
        working-directory: frontend

      # Direct pushes to develop are this project's normal flow, so the full
      # PR CI (deploy.yml) usually never runs — without these two steps the
      # main delivery path would deploy frontend code that was never tested
      # or linted.
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Test frontend
        run: npm test
        working-directory: frontend

      - name: Build frontend (OpenNext)
        run: npx open-next build
        working-directory: frontend

      - name: Package Next.js Lambda
        run: |
          mkdir -p infra/builds
          cd frontend/.open-next/server-functions/default
          find . -exec touch -t 202001010000.00 {} \;
          zip -rX ../../../../infra/builds/nextjs.zip .

      - name: Copy frontend static assets
        run: cp -r frontend/.open-next/assets infra/builds/nextjs-assets

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts-frontend
          path: |
            infra/builds/nextjs.zip
            infra/builds/nextjs-assets/
          retention-days: 1

  # ==============================================================
  # JOB 1c: Test Admin — paralelo com 1a/1b
  # The admin SPA is only BUILT during deploy (it needs terraform outputs),
  # so without this job its tests/lint never ran on the direct-push flow.
  # ==============================================================
  test-admin:
    name: 1c. Test Admin
    runs-on: ubuntu-latest
    needs: [check-types-drift]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: admin/node_modules
          key: admin-${{ runner.os }}-${{ hashFiles('admin/package-lock.json') }}
          restore-keys: admin-${{ runner.os }}-

      - name: Install admin dependencies
        run: npm ci
        working-directory: admin

      - name: Dependency audit (npm audit)
        run: npm audit --audit-level=high
        working-directory: admin

      - name: Lint admin
        run: npm run lint
        working-directory: admin

      - name: Test admin
        run: npm test
        working-directory: admin

  # ==============================================================
  # JOB 1d: Security scans (Semgrep + Gitleaks) — reused from security.yml
  # via workflow_call. Previously this ran only as a parallel, independent
  # workflow with no bearing on whether deploy-dev/plan-prod ran below — a
  # failing scan never blocked a deploy. Listing it in their `needs` is what
  # turns it into an actual gate.
  # ==============================================================
  security-scans:
    name: 1d. Security Scans (Semgrep + Gitleaks)
    uses: ./.github/workflows/security.yml
    secrets: inherit

  # ==============================================================
  # JOB 1e: Validate infra (Terraform fmt/validate/TFLint + Trivy config
  # scan) — same checks deploy.yml already runs on PRs against main, but
  # deploy.yml rarely runs in this project's normal flow (direct pushes to
  # develop). Without this job here, TFLint/Trivy never actually gated a
  # deploy despite existing in the repo.
  # ==============================================================
  validate-infra:
    name: 1e. Validate Infra (Terraform + TFLint + Trivy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform fmt check
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        working-directory: infra
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infra
        run: terraform validate

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('infra/.tflint.hcl') }}

      - name: TFLint
        working-directory: infra
        run: |
          tflint --init
          tflint --recursive --chdir=.

      - name: Trivy config scan (IaC)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # ==============================================================
  # JOB 2a: Deploy para Dev (branch develop)
  # ==============================================================
  deploy-dev:
    name: 2a. Deploy → Dev
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, test-admin, test-backend-integration, security-scans, validate-infra]
    if: github.ref == 'refs/heads/develop'
    environment: dev

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts-backend
          path: infra/builds/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts-frontend
          path: infra/builds/

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init (dev)
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ env.PROJECT_NAME }}-dev-tfstate" \
            -backend-config="key=blog/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform Apply (dev)
        working-directory: infra
        run: terraform apply -auto-approve -var-file="env/dev.tfvars"

      # Single -json call instead of 9 separate -raw invocations — each -raw
      # spawns a full terraform process (~1.5-2s each, ~15s per deploy).
      - name: Get Terraform outputs
        id: tf
        working-directory: infra
        run: |
          outputs=$(terraform output -json)
          jq -r '"api_url=\(.api_base_url.value)",
                 "frontend_bucket=\(.frontend_bucket.value)",
                 "frontend_cf=\(.frontend_cloudfront_id.value)",
                 "admin_bucket=\(.admin_bucket.value)",
                 "admin_cf=\(.admin_cloudfront_id.value)",
                 "cognito_pool=\(.cognito_user_pool_id.value)",
                 "cognito_client=\(.cognito_client_id.value)",
                 "admin_url=\(.admin_url.value)",
                 "frontend_url=\(.frontend_url.value)"' <<< "$outputs" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: admin/node_modules
          key: admin-${{ runner.os }}-${{ hashFiles('admin/package-lock.json') }}
          restore-keys: admin-${{ runner.os }}-

      - name: Install admin dependencies
        run: npm ci
        working-directory: admin

      - name: Build admin SPA
        working-directory: admin
        env:
          VITE_API_BASE_URL: ${{ steps.tf.outputs.api_url }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.tf.outputs.cognito_pool }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.tf.outputs.cognito_client }}
          VITE_ASSETS_URL: ${{ steps.tf.outputs.frontend_url }}
        run: npm run build

      - name: Sync frontend static assets to S3
        run: |
          aws s3 sync infra/builds/nextjs-assets s3://${{ steps.tf.outputs.frontend_bucket }} \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "media/*"

      - name: Sync admin SPA to S3
        run: |
          aws s3 sync admin/dist s3://${{ steps.tf.outputs.admin_bucket }} \
            --cache-control "no-cache, no-store, must-revalidate" \
            --delete

      - name: Invalidate CloudFront (frontend + admin)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.tf.outputs.frontend_cf }} \
            --paths "/*"
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.tf.outputs.admin_cf }} \
            --paths "/*"

      - name: Smoke test pós-deploy
        run: |
          # frontend_url e admin_url ja vem com https:// (infra/outputs.tf)
          for url in "${{ steps.tf.outputs.frontend_url }}" "${{ steps.tf.outputs.admin_url }}"; do
            echo "Verificando $url ..."
            status=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 10 --retry-all-errors "$url")
            if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
              echo "FALHA: $url respondeu $status"
              exit 1
            fi
            echo "OK: $url respondeu $status"
          done

          # API smoke: catches IAM/policy and gateway-wiring gaps that only
          # manifest against the real services (unit tests mock all of AWS).
          for path in "/artigos" "/posts/recentes?limit=1"; do
            api="${{ steps.tf.outputs.api_url }}${path}"
            echo "Verificando API $api ..."
            status=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 --retry-all-errors "$api")
            if [ "$status" != "200" ]; then
              echo "FALHA: $api respondeu $status"
              exit 1
            fi
            echo "OK: $api respondeu 200"
          done

      # The curl smoke above only proves both URLs answer 2xx/3xx — not that
      # the app renders. The Playwright smoke spec drives a real browser
      # against the freshly deployed environment. Chromium only: cross-browser
      # belongs to the full e2e suite (local), not to this deploy gate.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: frontend/node_modules
          key: frontend-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: frontend-${{ runner.os }}-

      - name: Install frontend dependencies (E2E smoke)
        run: npm ci
        working-directory: frontend

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: E2E smoke pós-deploy (Playwright)
        run: npx playwright test e2e/smoke.spec.ts --project=chromium
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.tf.outputs.frontend_url }}

      - name: Deploy summary
        run: |
          echo "### Deploy Dev Concluído ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend:** https://${{ steps.tf.outputs.frontend_bucket }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Admin:** ${{ steps.tf.outputs.admin_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API:** ${{ steps.tf.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY

  # ==============================================================
  # JOB 2b: Terraform Plan para Prod (branch main)
  # ==============================================================
  plan-prod:
    name: 2b. Terraform Plan → Prod
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, test-admin, test-backend-integration, security-scans, validate-infra]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts-backend
          path: infra/builds/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts-frontend
          path: infra/builds/

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init (prod)
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ env.PROJECT_NAME }}-prod-tfstate" \
            -backend-config="key=blog/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform Plan (prod)
        working-directory: infra
        run: |
          terraform plan -var-file="env/prd.tfvars" -out=tfplan-prod
          terraform show -no-color tfplan-prod >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-prod
          path: infra/tfplan-prod
          retention-days: 1

  # ==============================================================
  # JOB 3: Aprovação Manual (gate para prod)
  # ==============================================================
  approve-prod:
    name: 3. Aprovação Manual
    runs-on: ubuntu-latest
    needs: plan-prod
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - run: echo "Deploy para produção aprovado."

  # ==============================================================
  # JOB 4: Deploy para Prod (após aprovação)
  # ==============================================================
  deploy-prod:
    name: 4. Deploy → Prod
    runs-on: ubuntu-latest
    needs: approve-prod
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts-backend
          path: infra/builds/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts-frontend
          path: infra/builds/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-prod
          path: infra/

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init (prod)
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ env.PROJECT_NAME }}-prod-tfstate" \
            -backend-config="key=blog/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform Apply (prod — executa o plano aprovado)
        working-directory: infra
        run: terraform apply tfplan-prod

      # Single -json call instead of 9 separate -raw invocations — each -raw
      # spawns a full terraform process (~1.5-2s each, ~15s per deploy).
      - name: Get Terraform outputs
        id: tf
        working-directory: infra
        run: |
          outputs=$(terraform output -json)
          jq -r '"api_url=\(.api_base_url.value)",
                 "frontend_bucket=\(.frontend_bucket.value)",
                 "frontend_cf=\(.frontend_cloudfront_id.value)",
                 "admin_bucket=\(.admin_bucket.value)",
                 "admin_cf=\(.admin_cloudfront_id.value)",
                 "cognito_pool=\(.cognito_user_pool_id.value)",
                 "cognito_client=\(.cognito_client_id.value)",
                 "admin_url=\(.admin_url.value)",
                 "frontend_url=\(.frontend_url.value)"' <<< "$outputs" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: admin/node_modules
          key: admin-${{ runner.os }}-${{ hashFiles('admin/package-lock.json') }}
          restore-keys: admin-${{ runner.os }}-

      - name: Install admin dependencies
        run: npm ci
        working-directory: admin

      - name: Build admin SPA (com outputs de prod)
        working-directory: admin
        env:
          VITE_API_BASE_URL: ${{ steps.tf.outputs.api_url }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.tf.outputs.cognito_pool }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.tf.outputs.cognito_client }}
          VITE_ASSETS_URL: ${{ steps.tf.outputs.frontend_url }}
        run: npm run build

      - name: Sync frontend static assets to S3
        run: |
          aws s3 sync infra/builds/nextjs-assets s3://${{ steps.tf.outputs.frontend_bucket }} \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "media/*"

      - name: Sync admin SPA to S3
        run: |
          aws s3 sync admin/dist s3://${{ steps.tf.outputs.admin_bucket }} \
            --cache-control "no-cache, no-store, must-revalidate" \
            --delete

      - name: Invalidate CloudFront (frontend + admin)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.tf.outputs.frontend_cf }} \
            --paths "/*"
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.tf.outputs.admin_cf }} \
            --paths "/*"

      - name: Smoke test pós-deploy
        run: |
          # frontend_url e admin_url ja vem com https:// (infra/outputs.tf)
          for url in "${{ steps.tf.outputs.frontend_url }}" "${{ steps.tf.outputs.admin_url }}"; do
            echo "Verificando $url ..."
            status=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 10 --retry-all-errors "$url")
            if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
              echo "FALHA: $url respondeu $status"
              exit 1
            fi
            echo "OK: $url respondeu $status"
          done

          # API smoke: catches IAM/policy and gateway-wiring gaps that only
          # manifest against the real services (unit tests mock all of AWS).
          for path in "/artigos" "/posts/recentes?limit=1"; do
            api="${{ steps.tf.outputs.api_url }}${path}"
            echo "Verificando API $api ..."
            status=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 --retry-all-errors "$api")
            if [ "$status" != "200" ]; then
              echo "FALHA: $api respondeu $status"
              exit 1
            fi
            echo "OK: $api respondeu 200"
          done

      - name: Deploy summary
        run: |
          echo "### Deploy Prod Concluído ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend:** https://${{ steps.tf.outputs.frontend_bucket }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Admin:** ${{ steps.tf.outputs.admin_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API:** ${{ steps.tf.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
