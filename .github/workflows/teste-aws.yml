name: Teste de Autenticação AWS OIDC

# Gatilho: Este workflow roda manualmente (na aba Actions)
# ou quando houver um push na branch 'main'
on:
  workflow_dispatch: # Permite que você clique em "Run" na UI do GitHub
  push:
    branches:
      - main # Mude isso se a sua branch principal tiver outro nome

# Permissões essenciais para o OIDC
permissions:
  id-token: write  # Necessário para obter o token OIDC
  contents: read   # Necessário para o checkout do código

jobs:
  aws-test:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout do código
        uses: actions/checkout@v4

      - name: 2. Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # 👇 COLOQUE O ARN DA SUA ROLE GERADO PELO CLOUDFORMATION AQUI
          role-to-assume: COLE_SEU_ROLE_ARN_AQUI
          aws-region: us-east-1 # Mude para a sua região principal

      - name: 3. Testar Autenticação (Verificar Identidade)
        run: |
          echo "Verificando quem eu sou na AWS..."
          aws sts get-caller-identity

      - name: 4. Testar Permissões (Listar Buckets S3)
        # Este comando só funcionará se a sua role tiver permissão (você usou Admin, então vai funcionar)
        run: |
          echo "Testando permissões de Admin (Listando buckets S3)..."
          aws s3 ls
