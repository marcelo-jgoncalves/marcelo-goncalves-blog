name: Pull Request Validation (CI)

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  # --- JOB 1: Test Backend (Jest + audit) ---
  test-backend:
    runs-on: ubuntu-latest
    name: 1. Backend Tests (Jest)

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Install dependencies (npm workspaces)
        run: npm ci

      - name: Security scan (npm audit)
        run: npm audit --audit-level=high
        working-directory: backend

      - name: Typecheck
        run: npm run typecheck
        working-directory: backend

      - name: Lint (ESLint)
        run: npm run lint
        working-directory: backend

      - name: Run unit tests
        run: npm test
        working-directory: backend

      - name: Build (esbuild + Sharp)
        run: npm run build
        working-directory: backend

  # --- JOB 1b: Backend Integration Tests (DynamoDB Local) ---
  # Unit tests mock dynamo.send entirely — these run the real handlers
  # against a real DynamoDB (see backend/src/integration/).
  test-backend-integration:
    runs-on: ubuntu-latest
    name: 1b. Backend Integration Tests (DynamoDB Local)

    services:
      dynamodb:
        image: amazon/dynamodb-local@sha256:d7ebddeb60fa418bcda218a6c6a402a58441b2a20d54c9cb1d85fd5194341753 # 2.5.2
        ports:
          - 8000:8000

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Install dependencies (npm workspaces)
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        working-directory: backend
        env:
          AWS_ENDPOINT_URL: http://localhost:8000

  # --- JOB 2: Test Frontend (Jest + audit) ---
  test-frontend:
    runs-on: ubuntu-latest
    name: 2. Frontend Tests (Jest)

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Install dependencies (npm workspaces)
        run: npm ci

      - name: Security scan (npm audit)
        run: npm audit --audit-level=high
        working-directory: frontend

      - name: Run unit tests
        run: npm test
        working-directory: frontend

      - name: Lint (ESLint)
        run: npm run lint
        working-directory: frontend

      - name: Build (Next.js)
        run: npm run build
        working-directory: frontend
        env:
          API_URL: https://5duus31al8.execute-api.us-east-1.amazonaws.com/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  # --- JOB 3: Test Admin (Vitest + audit) ---
  test-admin:
    runs-on: ubuntu-latest
    name: 3. Admin Tests (Vitest)

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Install dependencies (npm workspaces)
        run: npm ci

      - name: Security scan (npm audit)
        run: npm audit --audit-level=high
        working-directory: admin

      - name: Run unit tests
        run: npm test
        working-directory: admin

      - name: Lint (ESLint)
        run: npm run lint
        working-directory: admin

      - name: Build (type-check + Vite)
        run: npm run build
        working-directory: admin
        env:
          VITE_API_BASE_URL: https://5duus31al8.execute-api.us-east-1.amazonaws.com/v1
          VITE_COGNITO_USER_POOL_ID: placeholder
          VITE_COGNITO_CLIENT_ID: placeholder
          VITE_ASSETS_URL: https://dsns2wusdrj9z.cloudfront.net

  # --- JOB 3b: Test the @mgoncalves/contracts package (Jest + typecheck + audit) ---
  test-contracts:
    runs-on: ubuntu-latest
    name: 3b. Contracts Tests (Jest)

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Install dependencies (npm workspaces)
        run: npm ci

      - name: Security scan (npm audit)
        run: npm audit --audit-level=high
        working-directory: packages/contracts

      - name: Typecheck
        run: npm run typecheck
        working-directory: packages/contracts

      - name: Run unit tests
        run: npm test
        working-directory: packages/contracts

  # --- JOB 3: Validate Infrastructure (Terraform) ---
  validate-infrastructure:
    runs-on: ubuntu-latest
    name: 3. Validate Infra (Terraform)

    outputs:
      tf_files_found: ${{ steps.files.outputs.tf }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check for .tf files
        id: files
        # Checks whether any .tf file exists
        run: |
          if [ -n "$(find . -maxdepth 2 -type f -name '*.tf' -print -quit)" ]; then
            echo "tf=true" >> $GITHUB_OUTPUT
          else
            echo "tf=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
        if: steps.files.outputs.tf == 'true'

      # The 'Install Security Scanner (tfsec)' step was removed.

      - name: Terraform Init
        working-directory: infra
        run: terraform init -backend=false
        if: steps.files.outputs.tf == 'true'

      - name: Infra Lint (Format)
        working-directory: infra
        run: terraform fmt --check -recursive
        if: steps.files.outputs.tf == 'true'

      # terraform validate evaluates filebase64sha256() over each Lambda zip
      # (source_code_hash) — the function call fails if the file doesn't
      # exist, and this job never builds the real artifacts. Content is
      # irrelevant for validate, only the function call needs to resolve.
      - name: Create placeholder build artifacts (validate only)
        run: |
          mkdir -p infra/builds
          for name in nextjs mediaUpload getPost getAuthor getPosts adminPosts adminAuthors adminCategories adminSession adminAuthorizer postScheduler imageProcessor postCounterReconciler; do
            touch "infra/builds/${name}.zip"
          done
        if: steps.files.outputs.tf == 'true'

      - name: Syntax Validation
        working-directory: infra
        run: terraform validate
        if: steps.files.outputs.tf == 'true'

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0
        if: steps.files.outputs.tf == 'true'

      - name: Cache TFLint plugins
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('infra/.tflint.hcl') }}
        if: steps.files.outputs.tf == 'true'

      - name: Infra Lint (TFLint)
        working-directory: infra
        run: |
          tflint --init
          tflint --recursive --chdir=.
        if: steps.files.outputs.tf == 'true'

      - name: Security Scan (SAST with Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Scan type: 'config' for IaC files (Terraform, etc.)
          scan-type: 'config'
          # Directory to scan
          scan-ref: '.'
          # Output format (optional, but good for logs)
          format: 'table'
          # Fail the pipeline if CRITICAL or HIGH vulnerabilities are found
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
        if: steps.files.outputs.tf == 'true'

      - name: Skip Terraform steps
        run: echo "No .tf files found, skipping Infra checks."
        if: steps.files.outputs.tf == 'false'
