name: Validacao de Pull Request (CI)

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  # --- JOB 1: Validar a Aplicacao (Next.js) ---
  validate-application:
    runs-on: ubuntu-latest
    name: 1. Validar Aplicacao (JS)
    
    outputs:
      js_files_found: ${{ steps.files.outputs.pkg }}
      
    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Verificar existencia do package.json
        id: files 
        run: |
          if [ -f "package.json" ]; then
            echo "pkg=true" >> $GITHUB_OUTPUT
          else
            echo "pkg=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
        if: steps.files.outputs.pkg == 'true'

      - name: Instalar Dependencias (npm ci)
        run: npm ci
        if: steps.files.outputs.pkg == 'true'

      - name: Scan de Dependencias (Seguranca)
        run: npm audit --audit-level=high
        if: steps.files.outputs.pkg == 'true'

      - name: Lint de Codigo (Qualidade)
        run: |
          if grep -q "\"lint\"" package.json; then
            echo "Script 'lint' encontrado, executando..."
            npm run lint
          else
            echo "Script 'lint' nao encontrado, pulando."
          fi
        if: steps.files.outputs.pkg == 'true'

      - name: Testes Unitarios/Integracao
        run: |
          if grep -q "\"test\"" package.json; then
            echo "Script 'test' encontrado, executando..."
            npm test -- --passWithNoTests
          else
            echo "Script 'test' nao encontrado, pulando."
          fi
        if: steps.files.outputs.pkg == 'true'

      - name: Build da Aplicacao (Next.js)
        run: |
          if grep -q "\"build\"" package.json; then
            echo "Script 'build' encontrado, executando..."
            npm run build
          else
            echo "Script 'build' nao encontrado, pulando."
          fi
        if: steps.files.outputs.pkg == 'true'

      - name: Pular passos de JS
        run: echo "Nenhum package.json encontrado, pulando checks de JS."
        if: steps.files.outputs.pkg == 'false'

  # --- JOB 2: Testar o Backend (Jest) ---
  test-backend:
    runs-on: ubuntu-latest
    name: 2. Testes Backend (Jest)

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependencias do Backend
        run: npm ci
        working-directory: backend

      - name: Rodar Testes Unitarios
        run: npm test
        working-directory: backend

  # --- JOB 2b: Testar o Frontend (Jest) ---
  test-frontend:
    runs-on: ubuntu-latest
    name: 2b. Testes Frontend (Jest)

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependencias do Frontend
        run: npm ci
        working-directory: frontend

      - name: Rodar Testes Unitarios
        run: npm test
        working-directory: frontend

  # --- JOB 2c: Testar o Admin (Vitest) ---
  test-admin:
    runs-on: ubuntu-latest
    name: 2c. Testes Admin (Vitest)

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependencias do Admin
        run: npm ci
        working-directory: admin

      - name: Rodar Testes Unitarios
        run: npm test
        working-directory: admin

  # --- JOB 3: Validar a Infraestrutura (Terraform) ---
  validate-infrastructure:
    runs-on: ubuntu-latest
    name: 3. Validar Infra (Terraform)
    
    outputs:
      tf_files_found: ${{ steps.files.outputs.tf }}
      
    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Verificar existencia de arquivos .tf
        id: files
        # Verifica se algum arquivo .tf existe
        run: |
          if [ -n "$(find . -maxdepth 2 -type f -name '*.tf' -print -quit)" ]; then
            echo "tf=true" >> $GITHUB_OUTPUT
          else
            echo "tf=false" >> $GITHUB_OUTPUT
          fi

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0
        if: steps.files.outputs.tf == 'true'
      
      # O passo 'Instalar Scanner de Seguranca (tfsec)' foi removido.

      - name: Terraform Init
        run: terraform init -backend=false
        if: steps.files.outputs.tf == 'true'

      - name: Lint de Infra (Formato)
        run: terraform fmt --check
        if: steps.files.outputs.tf == 'true'

      - name: Validacao de Sintaxe
        run: terraform validate
        if: steps.files.outputs.tf == 'true'

      # CORRECAO: Substituindo o 'tfsec' obsoleto pelo 'trivy'
      - name: Scan de Seguranca (SAST com Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          # Tipo de scan: 'config' para arquivos IaC (Terraform, etc.)
          scan-type: 'config'
          # Diretorio que sera escaneado
          scan-ref: '.'
          # Formato da saida (opcional, mas bom para logs)
          format: 'table'
          # Falhar o pipeline se encontrar vulnerabilidades CRITICAS ou ALTAS
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
        if: steps.files.outputs.tf == 'true'
        
      - name: Pular passos de Terraform
        run: echo "Nenhum arquivo .tf encontrado, pulando checks de Infra."
        if: steps.files.outputs.tf == 'false'