name: Validacao de Pull Request (CI)

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  # --- JOB 1: Testar o Backend (Jest + audit) ---
  test-backend:
    runs-on: ubuntu-latest
    name: 1. Testes Backend (Jest)

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependencias do Backend
        run: npm ci
        working-directory: backend

      - name: Scan de Seguranca (npm audit)
        run: npm audit --audit-level=high
        working-directory: backend

      - name: Rodar Testes Unitarios
        run: npm test
        working-directory: backend

      - name: Build (esbuild + Sharp)
        run: npm run build
        working-directory: backend

  # --- JOB 2: Testar o Frontend (Jest + audit) ---
  test-frontend:
    runs-on: ubuntu-latest
    name: 2. Testes Frontend (Jest)

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependencias do Frontend
        run: npm ci
        working-directory: frontend

      - name: Scan de Seguranca (npm audit)
        run: npm audit --audit-level=high
        working-directory: frontend

      - name: Rodar Testes Unitarios
        run: npm test
        working-directory: frontend

      - name: Lint (ESLint)
        run: npm run lint
        working-directory: frontend

      - name: Build (Next.js)
        run: npm run build
        working-directory: frontend
        env:
          API_URL: https://5duus31al8.execute-api.us-east-1.amazonaws.com/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  # --- JOB 3: Testar o Admin (Vitest + audit) ---
  test-admin:
    runs-on: ubuntu-latest
    name: 3. Testes Admin (Vitest)

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependencias do Admin
        run: npm ci
        working-directory: admin

      - name: Scan de Seguranca (npm audit)
        run: npm audit --audit-level=high
        working-directory: admin

      - name: Rodar Testes Unitarios
        run: npm test
        working-directory: admin

      - name: Lint (ESLint)
        run: npm run lint
        working-directory: admin

      - name: Build (type-check + Vite)
        run: npm run build
        working-directory: admin
        env:
          VITE_API_BASE_URL: https://5duus31al8.execute-api.us-east-1.amazonaws.com/v1
          VITE_COGNITO_USER_POOL_ID: placeholder
          VITE_COGNITO_CLIENT_ID: placeholder
          VITE_ASSETS_URL: https://dsns2wusdrj9z.cloudfront.net

  # --- JOB 3: Validar a Infraestrutura (Terraform) ---
  validate-infrastructure:
    runs-on: ubuntu-latest
    name: 3. Validar Infra (Terraform)
    
    outputs:
      tf_files_found: ${{ steps.files.outputs.tf }}
      
    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Verificar existencia de arquivos .tf
        id: files
        # Verifica se algum arquivo .tf existe
        run: |
          if [ -n "$(find . -maxdepth 2 -type f -name '*.tf' -print -quit)" ]; then
            echo "tf=true" >> $GITHUB_OUTPUT
          else
            echo "tf=false" >> $GITHUB_OUTPUT
          fi

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0
        if: steps.files.outputs.tf == 'true'
      
      # O passo 'Instalar Scanner de Seguranca (tfsec)' foi removido.

      - name: Terraform Init
        run: terraform init -backend=false
        if: steps.files.outputs.tf == 'true'

      - name: Lint de Infra (Formato)
        run: terraform fmt --check
        if: steps.files.outputs.tf == 'true'

      - name: Validacao de Sintaxe
        run: terraform validate
        if: steps.files.outputs.tf == 'true'

      # CORRECAO: Substituindo o 'tfsec' obsoleto pelo 'trivy'
      - name: Scan de Seguranca (SAST com Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          # Tipo de scan: 'config' para arquivos IaC (Terraform, etc.)
          scan-type: 'config'
          # Diretorio que sera escaneado
          scan-ref: '.'
          # Formato da saida (opcional, mas bom para logs)
          format: 'table'
          # Falhar o pipeline se encontrar vulnerabilidades CRITICAS ou ALTAS
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
        if: steps.files.outputs.tf == 'true'
        
      - name: Pular passos de Terraform
        run: echo "Nenhum arquivo .tf encontrado, pulando checks de Infra."
        if: steps.files.outputs.tf == 'false'