name: Validacao de Pull Request (CI)

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  # --- JOB 1: Testar o Backend (Jest + audit) ---
  test-backend:
    runs-on: ubuntu-latest
    name: 1. Testes Backend (Jest)

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Instalar Dependencias do Pacote de Contratos
        run: npm ci
        working-directory: packages/contracts

      - name: Instalar Dependencias do Backend
        run: npm ci
        working-directory: backend

      - name: Scan de Seguranca (npm audit)
        run: npm audit --audit-level=high
        working-directory: backend

      - name: Lint (ESLint)
        run: npm run lint
        working-directory: backend

      - name: Rodar Testes Unitarios
        run: npm test
        working-directory: backend

      - name: Build (esbuild + Sharp)
        run: npm run build
        working-directory: backend

  # --- JOB 1b: Testes de Integração do Backend (DynamoDB Local) ---
  # Unit tests mock dynamo.send entirely — these run the real handlers
  # against a real DynamoDB (see backend/src/integration/).
  test-backend-integration:
    runs-on: ubuntu-latest
    name: 1b. Testes de Integração Backend (DynamoDB Local)

    services:
      dynamodb:
        image: amazon/dynamodb-local@sha256:d7ebddeb60fa418bcda218a6c6a402a58441b2a20d54c9cb1d85fd5194341753 # 2.5.2
        ports:
          - 8000:8000

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Instalar Dependencias do Pacote de Contratos
        run: npm ci
        working-directory: packages/contracts

      - name: Instalar Dependencias do Backend
        run: npm ci
        working-directory: backend

      - name: Rodar Testes de Integração
        run: npm run test:integration
        working-directory: backend
        env:
          AWS_ENDPOINT_URL: http://localhost:8000

  # --- JOB 2: Testar o Frontend (Jest + audit) ---
  test-frontend:
    runs-on: ubuntu-latest
    name: 2. Testes Frontend (Jest)

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Instalar Dependencias do Frontend
        run: npm ci
        working-directory: frontend

      - name: Scan de Seguranca (npm audit)
        run: npm audit --audit-level=high
        working-directory: frontend

      - name: Rodar Testes Unitarios
        run: npm test
        working-directory: frontend

      - name: Lint (ESLint)
        run: npm run lint
        working-directory: frontend

      - name: Build (Next.js)
        run: npm run build
        working-directory: frontend
        env:
          API_URL: https://5duus31al8.execute-api.us-east-1.amazonaws.com/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  # --- JOB 3: Testar o Admin (Vitest + audit) ---
  test-admin:
    runs-on: ubuntu-latest
    name: 3. Testes Admin (Vitest)

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Instalar Dependencias do Pacote de Contratos
        run: npm ci
        working-directory: packages/contracts

      - name: Instalar Dependencias do Admin
        run: npm ci
        working-directory: admin

      - name: Scan de Seguranca (npm audit)
        run: npm audit --audit-level=high
        working-directory: admin

      - name: Rodar Testes Unitarios
        run: npm test
        working-directory: admin

      - name: Lint (ESLint)
        run: npm run lint
        working-directory: admin

      - name: Build (type-check + Vite)
        run: npm run build
        working-directory: admin
        env:
          VITE_API_BASE_URL: https://5duus31al8.execute-api.us-east-1.amazonaws.com/v1
          VITE_COGNITO_USER_POOL_ID: placeholder
          VITE_COGNITO_CLIENT_ID: placeholder
          VITE_ASSETS_URL: https://dsns2wusdrj9z.cloudfront.net

  # --- JOB 3: Validar a Infraestrutura (Terraform) ---
  validate-infrastructure:
    runs-on: ubuntu-latest
    name: 3. Validar Infra (Terraform)
    
    outputs:
      tf_files_found: ${{ steps.files.outputs.tf }}
      
    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Verificar existencia de arquivos .tf
        id: files
        # Verifica se algum arquivo .tf existe
        run: |
          if [ -n "$(find . -maxdepth 2 -type f -name '*.tf' -print -quit)" ]; then
            echo "tf=true" >> $GITHUB_OUTPUT
          else
            echo "tf=false" >> $GITHUB_OUTPUT
          fi

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.8
        if: steps.files.outputs.tf == 'true'

      # O passo 'Instalar Scanner de Seguranca (tfsec)' foi removido.

      - name: Terraform Init
        working-directory: infra
        run: terraform init -backend=false
        if: steps.files.outputs.tf == 'true'

      - name: Lint de Infra (Formato)
        working-directory: infra
        run: terraform fmt --check -recursive
        if: steps.files.outputs.tf == 'true'

      # terraform validate evaluates filebase64sha256() over each Lambda zip
      # (source_code_hash) — the function call fails if the file doesn't
      # exist, and this job never builds the real artifacts. Content is
      # irrelevant for validate, only the function call needs to resolve.
      - name: Criar artefatos de build placeholder (só para validate)
        run: |
          mkdir -p infra/builds
          for name in nextjs mediaUpload getPost getAuthor getPosts adminPosts adminAuthors adminCategories adminSession adminAuthorizer postScheduler imageProcessor; do
            touch "infra/builds/${name}.zip"
          done
        if: steps.files.outputs.tf == 'true'

      - name: Validacao de Sintaxe
        working-directory: infra
        run: terraform validate
        if: steps.files.outputs.tf == 'true'

      - name: Configurar TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0
        if: steps.files.outputs.tf == 'true'

      - name: Cache de plugins do TFLint
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('infra/.tflint.hcl') }}
        if: steps.files.outputs.tf == 'true'

      - name: Lint de Infra (TFLint)
        working-directory: infra
        run: |
          tflint --init
          tflint --recursive --chdir=.
        if: steps.files.outputs.tf == 'true'

      # CORRECAO: Substituindo o 'tfsec' obsoleto pelo 'trivy'
      - name: Scan de Seguranca (SAST com Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Tipo de scan: 'config' para arquivos IaC (Terraform, etc.)
          scan-type: 'config'
          # Diretorio que sera escaneado
          scan-ref: '.'
          # Formato da saida (opcional, mas bom para logs)
          format: 'table'
          # Falhar o pipeline se encontrar vulnerabilidades CRITICAS ou ALTAS
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
        if: steps.files.outputs.tf == 'true'
        
      - name: Pular passos de Terraform
        run: echo "Nenhum arquivo .tf encontrado, pulando checks de Infra."
        if: steps.files.outputs.tf == 'false'