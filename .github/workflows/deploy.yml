#testew
name: Teste Limpo de Deploy (Dev)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

# Esta é a permissão que estava falhando
permissions:
  id-token: write
  contents: read

jobs:
  teste-dev-oidc:
    runs-on: ubuntu-latest
    
    # Esta é a tag de ambiente que estava causando a
    # incompatibilidade com a política do IAM
    environment:
      name: development
    
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Configurar Credenciais AWS (Dev)
        id: aws-creds-dev
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Sua role de DEV
          role-to-assume: arn:aws:iam::975707451904:role/GITHUB-ROLE-FOR-MARCELO-TECH-BLOG
          aws-region: us-east-1

      - name: 3. Testar Autenticação (Dev)
        run: |
          echo "Autenticado com sucesso como:"
          aws sts get-caller-identity
