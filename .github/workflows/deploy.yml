
# Teste final
name: Deploy para AWS (Dev e Prod)

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  #--- JOB DE DESENVOLVIMENTO ---
  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: development
    
    steps:
      - name: 1. Checkout do código
        uses: actions/checkout@v4

      - name: 2. Configurar Credenciais AWS (Dev)
        id: aws-creds-dev
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # 👇 COLOQUE SEU ARN DE DEV AQUI
          role-to-assume: arn:aws:iam::975707451904:role/GITHUB-ROLE-FOR-MARCELO-TECH-BLOG
          aws-region: us-east-1

      - name: 3. Testar Autenticação (Dev)
        run: |
          echo "Estou autenticado como (DEV):"
          aws sts get-caller-identity
          
      - name: 4. Testar Criação de Bucket (Dev)
        run: |
          NOME_BUCKET="meu-teste-dev-${{ github.run_id }}"
          REGIAO="${{ steps.aws-creds-dev.outputs.aws-region }}"

          echo "Tentando criar o bucket: $NOME_BUCKET na região $REGIAO"
          aws s3 mb s3://$NOME_BUCKET --region $REGIAO

          if [ $? -eq 0 ]; then
            echo "SUCESSO: Bucket $NOME_BUCKET criado."
          else
            echo "FALHA: Não foi possível criar o bucket."
            exit 1
          fi

          echo "Teste bem-sucedido. Limpando..."
          aws s3 rb s3://$NOME_BUCKET --region $REGIAO --force
          echo "Limpeza concluída. Teste de DEV OK."

  #--- JOB DE PRODUÇÃO ---
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      
    steps:
      - name: 1. Checkout do código
        uses: actions/checkout@v4

      - name: 2. Configurar Credenciais AWS (Prod)
        id: aws-creds-prod
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # 👇 COLOQUE SEU ARN DE PROD AQUI
          role-to-assume: arn:aws:iam::502987719862:role/GITHUB-ROLE-FOR-MARCELO-TECH-BLOG-PRD
          aws-region: us-east-1 

      - name: 3. Testar Autenticação (Prod)
        run: |
          echo "Estou autenticado como (PROD):"
          aws sts get-caller-identity
          
      - name: 4. Testar Criação de Bucket (Prod)
        run: |
          NOME_BUCKET="meu-teste-prod-${{ github.run_id }}"
          REGIAO="${{ steps.aws-creds-prod.outputs.aws-region }}"

          echo "Tentando criar o bucket: $NOME_BUCKET na região $REGIAO"
          aws s3 mb s3://$NOME_BUCKET --region $REGIAO

          if [ $? -eq 0 ]; then
            echo "SUCESSO: Bucket $NOME_BUCKET criado."
          else
            echo "FALHA: Não foi possível criar o bucket."
            exit 1
          fi

          echo "Teste bem-sucedido. Limpando..."
          aws s3 rb s3://$NOME_BUCKET --region $REGIAO --force
          echo "Limpeza concluída. Teste de PROD OK."
