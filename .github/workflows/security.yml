name: Security Scan

on:
  # No `push` trigger: cd.yml already calls this workflow via `workflow_call`
  # on every push to develop/main (see its security-scans job) — a separate
  # `push` trigger here ran a second, independent scan of the same commit,
  # doubling runner time with no extra coverage.
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
  # Lets cd.yml call this as a required job instead of only running it in
  # parallel — a failing scan here used to have no effect on whether
  # deploy-dev/plan-prod ran (see cd.yml's security-scans job for the
  # `needs` wiring that actually makes it a gate).
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Pinned version — this was the pipeline's only unpinned link (everything
      # else is SHA-pinned). Without a pin, a new Semgrep release can change
      # scan results with no code change. Dependabot doesn't cover pip inside
      # workflows, so bump manually from time to time.
      - name: Install Semgrep
        run: pip install semgrep==1.99.0

      - name: Scan backend (TypeScript + Node.js + dedicated security rules)
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/nodejs \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/jwt \
            --severity ERROR \
            --error \
            --quiet \
            backend/src/

      - name: Scan frontend (TypeScript + dedicated security rules)
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/jwt \
            --severity ERROR \
            --error \
            --quiet \
            frontend/

      - name: Scan admin (TypeScript + dedicated security rules)
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/jwt \
            --severity ERROR \
            --error \
            --quiet \
            admin/src/

  gitleaks:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
