name: Security Scan

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Scan backend (TypeScript + Node.js + segurança dedicada)
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/nodejs \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/jwt \
            --severity ERROR \
            --error \
            --quiet \
            backend/src/

      - name: Scan frontend (TypeScript + segurança dedicada)
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/jwt \
            --severity ERROR \
            --error \
            --quiet \
            frontend/

      - name: Scan admin (TypeScript + segurança dedicada)
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/jwt \
            --severity ERROR \
            --error \
            --quiet \
            admin/src/
