version: 2
updates:
  # npm workspaces (packages/contracts, backend, frontend, admin) share a
  # single hoisted lockfile at the repo root — Dependabot resolves updates
  # against the whole workspace tree from this one root entry, same as `npm
  # ci` does. One entry per workspace folder (the pre-migration setup) would
  # each point at a lockfile that no longer exists in that folder.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
